$font0 = Noto Sans Mono
$font1 = Inter Display Medium

general {
   hide_cursor = false
   immediate_render = true
   ignore_empty_input = true
}

animations {
   enabled = true
   bezier = linear, 1, 1, 0, 0
   bezier = easeOut, 0.25, 0.46, 0.45, 0.94
   animation = fadeIn, 1, 10, linear
   animation = fadeOut, 1, 3, linear
   animation = inputFieldDots, 1, 2.5, easeOut
}

background {
   monitor =
   path = screenshot
   color = rgba(37, 37, 47, 1)
   blur_passes = 3
   brightness = 0.55
   contrast = 1
}

# Time
label {
   monitor =
   text = cmd[update:1000] date +"%H : %M"
   color = rgba(239, 239, 239, 0.85)
   font_size = 20
   font_family = $font0
   position = 0, -80
   halign = center
   valign = top

   shadow_passes = 1
   shadow_size = 5
   shadow_boost = 0.35
}

# Day
label {
   monitor =
   text = cmd[update:60000] echo "<span text-transform='lowercase'>$(date +%A)</span>"
   color = rgba(239, 239, 239, 0.85)
   font_size = 100
   font_family = Stray
   position = 0, -125
   halign = center
   valign = top

   shadow_passes = 1
   shadow_size = 5
   shadow_boost = 0.35
}

# DD Month YYYY
label {
   monitor =
   text = cmd[update:1000] date +"- %d %B %Y -"
   color = rgba(239, 239, 239, 0.85)
   font_size = 20
   font_family = $font0
   position = 0, -265
   halign = center
   valign = top

   shadow_passes = 1
   shadow_size = 5
   shadow_boost = 0.35
}

# Profie picture
image {
   monitor =
   path = ~/.face
   border_color = rgba(255, 255, 255, 0.5)
   border_size = 3
   size = 150
   rounding = -1
   rotate = 0
   reload_time = -1
   reload_cmd = 
   position = 0, 75
   halign = center
   valign = center

   shadow_passes = 1
   shadow_size = 5
   shadow_boost = 0.35
}

# Username
label {
   monitor =
   text = $USER
   color = rgba(239, 239, 239, 0.85)
   font_size = 23
   font_family = $font0
   position = 0, -50
   halign = center
   valign = center

   shadow_passes = 1
   shadow_size = 5
   shadow_boost = 0.35
}

# Input field
input-field {
   monitor =
   size = 315, 60
   outline_thickness = 2
   rounding = 20
   dots_size = 0.22
   dots_spacing = 0.45
   dots_center = true
   outer_color = rgba(255, 255, 255, 0.4)
   inner_color = rgba(200, 200, 217, 0.3)
   font_color = rgba(239, 239, 239, 1)
   fail_color = rgba(255, 37, 164, 1)
   fade_on_empty = false
   font_family = $font0
   placeholder_text = <span font-family='FiraCode Nerd Font Propo'>󰌾 </span><i>Insert Password</i>
   position = 0, -150
   halign = center
   valign = center

   shadow_passes = 1
   shadow_size = 5
   shadow_boost = 0.35
}

# User card
shape {
   monitor =
   size = 400, 300
   color = rgba(200, 200, 217, 0.15)
   rounding = 40
   border_size = 2
   border_color = rgba(255, 255, 255, 0.45)
   position = 0, -75
   halign = center
   valign = center

   shadow_passes = 1
   shadow_size = 5
   shadow_boost = 0.35
}

# Uptime
label {
   monitor =
   text = cmd[update:1000] uptime -p | sed 's/^up / /'
   color = rgba(239, 239, 239, 0.85)
   font_size = 17
   font_family = $font0
   position = 0, -270
   halign = center
   valign = center

   shadow_passes = 1
   shadow_size = 5
   shadow_boost = 0.35
}

# Power off
label {
   monitor =
   text = 
   onclick = systemctl poweroff
   color = rgba(239, 239, 239, 0.85)
   font_size = 37
   font_family = FiraCode Nerd Font Propo
   position = -150, 80
   halign = center
   valign = bottom

   shadow_passes = 1
   shadow_size = 5
   shadow_boost = 0.35
}

# Reboot
label {
   monitor =
   text = 󰜉
   onclick = systemctl reboot
   color = rgba(239, 239, 239, 0.85)
   font_size = 40
   font_family = FiraCode Nerd Font Propo
   position = -50, 80
   halign = center
   valign = bottom

   shadow_passes = 1
   shadow_size = 5
   shadow_boost = 0.35
}

# Suspend
label {
   monitor =
   text = 󰤄
   onclick = systemctl suspend
   color = rgba(239, 239, 239, 0.85)
   font_size = 40
   font_family = FiraCode Nerd Font Propo
   position = 50, 80
   halign = center
   valign = bottom

   shadow_passes = 1
   shadow_size = 5
   shadow_boost = 0.35
}

# Quit
label {
   monitor =
   text = 󰍃
   onclick = niri msg action quit
   color = rgba(239, 239, 239, 0.85)
   font_size = 40
   font_family = FiraCode Nerd Font Propo
   position = 150, 80
   halign = center
   valign = bottom

   shadow_passes = 1
   shadow_size = 5
   shadow_boost = 0.35
}

